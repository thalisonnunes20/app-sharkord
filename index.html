<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sharkord</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          animation: {
            'float-1': 'float 20s infinite ease-in-out alternate',
            'float-2': 'float 25s infinite ease-in-out alternate',
            'float-3': 'float 30s infinite ease-in-out alternate-reverse',
          },
          keyframes: {
            float: {
              '0%': { transform: 'translate(0, 0) scale(1)' },
              '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
              '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
              '100%': { transform: 'translate(40px, 40px) scale(1)' },
            }
          }
        }
      }
    }
  </script>
</head>
<body class="h-screen w-screen flex items-center justify-center relative text-gray-200 select-none bg-[#1e1f22] overflow-hidden font-sans">
  
  <!-- Moving Background Lights (100% Tailwind) -->
  <div class="absolute blur-[80px] z-0 opacity-50 rounded-full w-[400px] h-[400px] bg-[#5865F2]/15 -top-[100px] -left-[100px] animate-float-1"></div>
  <div class="absolute blur-[80px] z-0 opacity-50 rounded-full w-[500px] h-[500px] bg-[#23A559]/10 -bottom-[150px] -right-[100px] animate-float-2"></div>
  <div class="absolute blur-[80px] z-0 opacity-50 rounded-full w-[300px] h-[300px] bg-[#00A8FC]/10 top-[30%] left-[50%] animate-float-3"></div>

  <!-- Main Card -->
  <div class="relative z-10 w-full max-w-[480px] bg-[#313338] rounded-lg p-8 shadow-lg">
    
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-[24px] font-bold text-[#f2f3f5] mb-2 tracking-wide">Boas-vindas de volta!</h1>
      <p class="text-[#b5bac1] text-[15px]">Estamos muito animados em ver você novamente.</p>
    </div>

    <!-- Form -->
    <form id="setup-form" class="flex flex-col text-left">
      <div class="mb-5">
        <label for="server-url" class="block text-[#b5bac1] text-[12px] font-bold uppercase tracking-wide mb-2">
          URL do Servidor Sharkord <span class="text-[#fa777c]">*</span>
        </label>
        <input 
          type="url" 
          id="server-url" 
          class="w-full bg-[#1e1f22] text-[#dbdee1] p-[10px] rounded-[3px] border-none outline-none focus:ring-1 focus:ring-[#5865F2] transition-shadow text-[16px]"
          placeholder="https://seu-servidor.com" 
          required 
          autocomplete="off"
          spellcheck="false"
        />
        <div class="hidden text-[#fa777c] text-[12px] mt-1.5 font-medium" id="error-message">
          Por favor, insira uma URL válida.
        </div>
      </div>

      <button 
        type="submit" 
        class="w-full bg-[#5865F2] hover:bg-[#4752C4] text-white font-medium text-[16px] py-[10px] px-4 rounded-[3px] transition-colors duration-200 submit-btn mt-2">
        Entrar
      </button>
    </form>
    
    <!-- Links de Ajuda -->
    <div class="mt-6 text-[#b5bac1] text-[12px] flex flex-col gap-2 items-center text-center">
      <span>
        Problemas com a plataforma? 
        <a href="https://github.com/sharkord/sharkord" target="_blank" class="text-[#00A8FC] hover:underline">Acesse o repositório oficial do Sharkord.</a>
      </span>
      <span>
        Dúvidas sobre este App para Windows? 
        <a href="https://github.com/thalisonnunes20/app-sharkord" target="_blank" class="text-[#00A8FC] hover:underline">Acesse o nosso repositório.</a>
      </span>
    </div>

  </div>

  <script src="renderer.js"></script>
</body>
</html>
