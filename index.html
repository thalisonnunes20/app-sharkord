<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sharkord</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  
  <div class="container">
    <div class="logo-container">
      <!-- Icone SVG generico de servidor/conexao -->
      <svg class="logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM11 19.93C7.05 19.43 4 16.05 4 12C4 7.95 7.05 4.57 11 4.07V19.93ZM13 4.07C16.95 4.57 20 7.95 20 12C20 16.05 16.95 19.43 13 19.93V4.07Z"/>
      </svg>
      <h1>Boas-vindas ao Sharkord!</h1>
      <p>Conecte-se ao seu servidor para começar a conversar.</p>
    </div>

    <form id="setup-form">
      <div class="input-group">
        <label for="server-url">Endereço do Servidor</label>
        <input 
          type="url" 
          id="server-url" 
          placeholder="ex: https://demo.sharkord.com" 
          required 
          autocomplete="off"
          spellcheck="false"
        />
        <div class="error-message" id="error-message">Por favor, insira uma URL válida (http/https).</div>
      </div>
      <button type="submit" class="submit-btn">Conectar</button>
    </form>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
