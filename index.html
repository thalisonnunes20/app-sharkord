<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuração do Sharkord</title>
  <link rel="stylesheet" href="index.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="background-animation"></div>
  
  <div class="glass-container">
    <div class="logo-container">
      <!-- A placeholder shark fin / wave icon SVG -->
      <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C12 2 11.054 6.946 7.5 10.5C3.946 14.054 2 15 2 15C2 15 3.5 16 6 16.5C8.5 17 12 17 12 17C12 17 15.5 17 18 16.5C20.5 16 22 15 22 15C22 15 20.054 14.054 16.5 10.5C12.946 6.946 12 2 12 2Z" fill="url(#gradient)" />
        <defs>
          <linearGradient id="gradient" x1="2" y1="2" x2="22" y2="17" gradientUnits="userSpaceOnUse">
            <stop stop-color="#4F46E5" />
            <stop offset="1" stop-color="#7C3AED" />
          </linearGradient>
        </defs>
      </svg>
      <h1>Bem-vindo ao Sharkord</h1>
      <p>Conecte-se ao seu servidor de comunicação em tempo real.</p>
    </div>

    <form id="setup-form">
      <div class="input-group">
        <label for="server-url">URL do Servidor</label>
        <input 
          type="url" 
          id="server-url" 
          placeholder="ex: https://demo.sharkord.com" 
          required 
          autocomplete="off"
        />
        <div class="error-message" id="error-message">Por favor, insira uma URL válida começando com http:// ou https://</div>
      </div>
      <button type="submit" class="submit-btn">Conectar</button>
    </form>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
