<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Sharkord</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1e1f22;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    #tab-bar {
      display: flex;
      background-color: #1e1f22;
      overflow-x: auto;
      overflow-y: hidden;
      flex-shrink: 0;
      border-bottom: 1px solid #111214;
      padding: 2px 2px 0 2px;
    }
    #tab-bar::-webkit-scrollbar { height: 4px; }
    #tab-bar::-webkit-scrollbar-track { background: #1e1f22; }
    #tab-bar::-webkit-scrollbar-thumb { background: #313338; border-radius: 4px; }
    
    #tabs-container {
      display: flex;
      gap: 2px;
    }

    .tab {
      display: flex;
      align-items: center;
      padding: 3px 10px;
      color: #b5bac1;
      font-size: 11px;
      cursor: pointer;
      min-width: 90px;
      max-width: 150px;
      background-color: #2b2d31;
      border-radius: 6px 6px 0 0;
      user-select: none;
      position: relative;
      transition: background-color 0.2s, color 0.2s;
    }
    .tab:hover { background-color: #35373c; color: #dbdee1; }
    .tab.active { background-color: #313338; color: #f2f3f5; font-weight: 500; }
    .tab-title { flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 6px; }
    .tab-close { opacity: 0.5; cursor: pointer; padding: 1px 5px; border-radius: 4px; font-size: 14px; line-height: 1; transition: all 0.2s; }
    .tab-close:hover { opacity: 1; background-color: #404249; color: #fa777c; }
    
    #add-tab {
      padding: 2px 10px;
      color: #b5bac1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      border-radius: 6px;
      margin-left: 2px;
      margin-bottom: 2px;
      transition: background-color 0.2s, color 0.2s;
    }
    #add-tab:hover { color: #f2f3f5; background-color: #2b2d31; }
    
    #webviews {
      flex-grow: 1;
      position: relative;
      background-color: #313338;
    }
    webview {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      border: none;
    }
    webview.tab-hidden {
      visibility: hidden;
      z-index: -1;
      position: absolute;
      top: -9999px;
      left: -9999px;
    }
    webview.active {
      visibility: visible;
      z-index: 1;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <div id="tab-bar">
    <div id="tabs-container" style="display: flex;"></div>
    <div id="add-tab" title="Nova Aba">+</div>
  </div>
  <div id="webviews"></div>

  <script>
    const tabsContainer = document.getElementById('tabs-container');
    const webviewsContainer = document.getElementById('webviews');
    const addTabBtn = document.getElementById('add-tab');
    
    let tabIdCounter = 0;
    let isInitLoading = true;
    let tabs = [];
    
    let preloadPath = '';
    let indexPath = '';
    let isLoaded = false;
    
    function formatFileUrl(p) {
      return 'file:///' + p.replace(/\\/g, '/');
    }

    function saveTabs() {
      if (isInitLoading || !window.electronAPI) return;
      const validUrls = tabs
        .map(t => t.url)
        .filter(url => url && url.startsWith('http'));
      const activeIdx = tabs.findIndex(t => t.tabEl.classList.contains('active'));
      window.electronAPI.saveTabs(validUrls, activeIdx >= 0 ? activeIdx : 0);
    }

    async function init() {
      if (window.electronAPI) {
        preloadPath = await window.electronAPI.getPreloadPath();
        indexPath = await window.electronAPI.getIndexPath();
        const savedUrl = await window.electronAPI.getSavedUrl();
        const enableTabs = await window.electronAPI.getEnableTabs();
        
        if (!enableTabs) {
          document.getElementById('tab-bar').style.display = 'none';
        }

        window.electronAPI.onToggleTabBar((show) => {
          document.getElementById('tab-bar').style.display = show ? 'flex' : 'none';
        });

        const savedTabsUrls = await window.electronAPI.getSavedTabs();
        const savedActiveIdx = await window.electronAPI.getActiveTabIndex();
        
        if (savedTabsUrls && savedTabsUrls.length > 0) {
          savedTabsUrls.forEach(url => createTab(url, false));
          const tabToActivate = tabs[savedActiveIdx] || tabs[tabs.length - 1];
          if (tabToActivate) {
             activateTab(tabToActivate.id);
          }
        } else {
          createTab(savedUrl || formatFileUrl(indexPath), true);
        }
        isInitLoading = false;
        isLoaded = true;
        saveTabs();
      }
    }

    function createTab(url, shouldActivate = true) {
      const id = 'tab-' + (++tabIdCounter);
      
      const tabEl = document.createElement('div');
      tabEl.className = 'tab';
      tabEl.dataset.id = id;
      
      const titleEl = document.createElement('div');
      titleEl.className = 'tab-title';
      titleEl.innerText = 'Nova Aba';
      
      const closeEl = document.createElement('div');
      closeEl.className = 'tab-close';
      closeEl.innerText = '×';
      closeEl.onclick = (e) => {
        e.stopPropagation();
        closeTab(id);
      };
      
      tabEl.appendChild(titleEl);
      tabEl.appendChild(closeEl);
      tabEl.onclick = () => activateTab(id);
      
      tabsContainer.appendChild(tabEl);
      
      const wv = document.createElement('webview');
      wv.id = 'webview-' + id;
      wv.dataset.id = id;
      wv.preload = formatFileUrl(preloadPath);
      wv.className = 'tab-hidden';
      
      const tabObj = { id, tabEl, wv, url };
      
      wv.addEventListener('page-title-updated', (e) => {
        titleEl.innerText = e.title || 'Sharkord';
      });
      wv.addEventListener('did-navigate', (e) => {
        tabObj.url = e.url;
        saveTabs();
      });
      wv.addEventListener('did-navigate-in-page', (e) => {
        tabObj.url = e.url;
        saveTabs();
      });
      
      webviewsContainer.appendChild(wv);
      wv.src = url;
      
      tabs.push(tabObj);
      if (shouldActivate) {
        activateTab(id);
      }
      saveTabs();
    }
    
    function activateTab(id) {
      tabs.forEach(tab => {
        if (tab.id === id) {
          tab.tabEl.classList.add('active');
          tab.wv.classList.remove('tab-hidden');
          tab.wv.classList.add('active');
        } else {
          tab.tabEl.classList.remove('active');
          tab.wv.classList.add('tab-hidden');
          tab.wv.classList.remove('active');
        }
      });
      saveTabs();
    }
    
    function closeTab(id) {
      const idx = tabs.findIndex(t => t.id === id);
      if (idx === -1) return;
      
      const tab = tabs[idx];
      tab.tabEl.remove();
      tab.wv.remove();
      tabs.splice(idx, 1);
      saveTabs();
      
      if (tabs.length === 0) {
        window.close();
      } else if (tab.tabEl.classList.contains('active')) {
        const newActive = tabs[Math.max(0, idx - 1)];
        activateTab(newActive.id);
      }
    }
    
    addTabBtn.onclick = () => {
      if (isLoaded) {
        createTab(formatFileUrl(indexPath));
      }
    };
    
    init();
  </script>
</body>
</html>
